<!-- checkin success phone -->
<g transform="translate(600 205)"><rect width="300" height="590" rx="38" fill="#242321"/><rect x="9" y="9" width="282" height="572" rx="30" fill="#F7F6F2"/><rect x="104" y="18" width="92" height="15" rx="8" fill="#242321"/><circle cx="150" cy="180" r="72" fill="#F0E7DF"/><image href="ch沉沦-mascot-reference.png" x="87" y="118" width="126" height="145" preserveAspectRatio="xMidYMid meet"/><text x="78" y="315" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="27" font-weight="600">打卡完成</text><text x="69" y="347" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="13">今天也留下了一点记录</text><rect x="32" y="399" width="236" height="78" rx="20" fill="#FFF" stroke="#E5E1D9"/><text x="52" y="430" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="12">你的记录</text><text x="52" y="456" fill="#5D5A55" font-family="Arial, Microsoft YaHei" font-size="13">今天见到你，很开心。</text><rect x="32" y="505" width="236" height="42" rx="21" fill="#B97063"/><text x="119" y="532" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="14">回到今天</text></g>
