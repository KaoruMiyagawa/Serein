<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#EDEBE5"/>
<text x="70" y="70" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="18" letter-spacing="4">沉沦 · FIRST VERSION</text>
<text x="70" y="118" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="38" font-weight="600">登录与情侣绑定</text>
<text x="70" y="150" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="16">第一版先完成账号和核心关系建立，微信 / QQ 登录后续接入</text>

<!-- login -->
<g transform="translate(85 215)"><rect width="260" height="535" rx="34" fill="#242321"/><rect x="8" y="8" width="244" height="519" rx="27" fill="#F7F6F2"/><rect x="97" y="17" width="66" height="13" rx="7" fill="#242321"/>
<text x="31" y="125" fill="#B97063" font-family="Arial" font-size="25">○</text><text x="31" y="185" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="30" font-weight="600">沉沦</text><text x="31" y="214" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="13">只属于你们的日常空间</text>
<rect x="31" y="275" width="198" height="44" rx="12" fill="#FFF" stroke="#E4E0D8"/><text x="45" y="303" fill="#AAA49A" font-family="Arial, Microsoft YaHei" font-size="13">手机号或邮箱</text><rect x="31" y="333" width="198" height="44" rx="12" fill="#FFF" stroke="#E4E0D8"/><text x="45" y="361" fill="#AAA49A" font-family="Arial, Microsoft YaHei" font-size="13">密码</text><rect x="31" y="400" width="198" height="44" rx="22" fill="#B97063"/><text x="113" y="428" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="14">登录</text><text x="82" y="479" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="12">注册账号</text></g>
<text x="85" y="790" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="19" font-weight="600">登录</text><text x="85" y="816" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="13">普通账号先跑通</text>

<!-- register -->
<g transform="translate(395 215)"><rect width="260" height="535" rx="34" fill="#242321"/><rect x="8" y="8" width="244" height="519" rx="27" fill="#F7F6F2"/><rect x="97" y="17" width="66" height="13" rx="7" fill="#242321"/><text x="31" y="78" fill="#8B867D" font-family="Arial" font-size="20">‹</text><text x="31" y="140" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="28" font-weight="600">注册</text><text x="31" y="168" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="13">创建你的沉沦账号</text><rect x="31" y="225" width="198" height="44" rx="12" fill="#FFF" stroke="#E4E0D8"/><text x="45" y="253" fill="#AAA49A" font-family="Arial, Microsoft YaHei" font-size="13">手机号或邮箱</text><rect x="31" y="283" width="198" height="44" rx="12" fill="#FFF" stroke="#E4E0D8"/><text x="45" y="311" fill="#AAA49A" font-family="Arial, Microsoft YaHei" font-size="13">设置密码</text><rect x="31" y="350" width="198" height="44" rx="22" fill="#B97063"/><text x="104" y="378" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="14">注册</text><text x="71" y="429" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="12">已有账号？登录</text></g>
<text x="395" y="790" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="19" font-weight="600">注册</text><text x="395" y="816" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="13">只保留必要字段</text>

<!-- create space -->
<g transform="translate(705 215)"><rect width="260" height="535" rx="34" fill="#242321"/><rect x="8" y="8" width="244" height="519" rx="27" fill="#F7F6F2"/><rect x="97" y="17" width="66" height="13" rx="7" fill="#242321"/><text x="31" y="78" fill="#8B867D" font-family="Arial" font-size="20">‹</text><text x="31" y="140" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="28" font-weight="600">绑定</text><text x="31" y="168" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="13">先创建你们的空间</text><circle cx="92" cy="238" r="31" fill="#D8B4A8"/><text x="82" y="245" fill="#FFF" font-family="Arial" font-size="14">你</text><circle cx="168" cy="238" r="31" fill="#DAD8CD"/><text x="157" y="245" fill="#FFF" font-family="Arial" font-size="14">?</text><rect x="31" y="300" width="198" height="44" rx="12" fill="#FFF" stroke="#E4E0D8"/><text x="45" y="328" fill="#AAA49A" font-family="Arial, Microsoft YaHei" font-size="13">空间名称（可选）</text><rect x="31" y="369" width="198" height="44" rx="22" fill="#B97063"/><text x="103" y="397" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="14">创建空间</text><text x="77" y="456" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="12">我有邀请码</text></g>
<text x="705" y="790" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="19" font-weight="600">创建空间</text><text x="705" y="816" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="13">创建后生成邀请码</text>

<!-- invite -->
<g transform="translate(1015 215)"><rect width="260" height="535" rx="34" fill="#242321"/><rect x="8" y="8" width="244" height="519" rx="27" fill="#F7F6F2"/><rect x="97" y="17" width="66" height="13" rx="7" fill="#242321"/><text x="31" y="78" fill="#8B867D" font-family="Arial" font-size="20">‹</text><text x="31" y="140" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="28" font-weight="600">邀请码</text><text x="31" y="168" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="13">输入另一半分享的邀请码</text><rect x="31" y="225" width="198" height="62" rx="14" fill="#F0E7DF"/><text x="71" y="264" fill="#5D5049" font-family="Arial" font-size="25" letter-spacing="6">A7K9Q2</text><rect x="31" y="315" width="198" height="44" rx="22" fill="#B97063"/><text x="105" y="343" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="14">确认绑定</text><text x="64" y="405" fill="#8B867D" font-family="Arial, Microsoft YaHei" font-size="12">绑定成功后进入今天</text><circle cx="130" cy="455" r="23" fill="#AEBCA9"/><text x="119" y="462" fill="#FFF" font-family="Arial, Microsoft YaHei" font-size="13">TA</text></g>
<text x="1015" y="790" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="19" font-weight="600">输入邀请码</text><text x="1015" y="816" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="13">绑定完成后进入首页</text>

<rect x="85" y="850" width="1190" height="1" fill="#D8D3CB"/><text x="85" y="875" fill="#B97063" font-family="Arial, Microsoft YaHei" font-size="14" font-weight="600">第一版流程：</text><text x="190" y="875" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="14">注册 / 登录 → 创建空间或输入邀请码 → 绑定成功 → 进入今天</text>
</svg>
