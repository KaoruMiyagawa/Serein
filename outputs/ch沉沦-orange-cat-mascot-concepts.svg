<text x="70" y="120" fill="#2B2A27" font-family="Arial, Microsoft YaHei" font-size="38" font-weight="600">橘猫吉祥物 · 4 个方向</text>
<text x="70" y="152" fill="#77736C" font-family="Arial, Microsoft YaHei" font-size="16">目标：一眼能认、缩小后清楚、适合图标，也能做轻量桌宠</text>

