  <rect x="28" y="260" width="334" height="78" rx="20" fill="#fff"/><text x="52" y="306" font-size="16" fill="#b97063">我的心情</text><text x="330" y="306" text-anchor="end" font-size="14" fill="#9a8f86">还没有记录  ›</text>
